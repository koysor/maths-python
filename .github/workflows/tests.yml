name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests with coverage
        run: uv run pytest tests/ -v --tb=short --cov --cov-report=term-missing

  pages-without-dev-dependencies:
    # The Docker image installs with --no-dev, so check the pages run that way too
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install runtime dependencies only
        run: uv sync --locked --no-dev

      - name: Run every page
        run: uv run --no-sync python tests/page_runner.py
