[project]
name = "maths-python"
version = "0.1.0"
description = "Educational interactive Streamlit web application providing Python code snippets for mathematics and statistics"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # Exact pin: SymPy parse_latex breaks on antlr4 4.13.x (see tests/test_lagrange_latex.py)
    "antlr4-python3-runtime==4.11",
    "matplotlib>=3.10.1",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scipy>=1.15.2",
    "streamlit>=1.66.1",
    "sympy>=1.13.3",
]

[dependency-groups]
dev = [
    "black[jupyter]>=26.1.0",
    "ipykernel>=6.29.5",
    "jupyterlab>=4.6.4",
    "marimo>=0.25.1",
    "mathml2latex>=0.2.12",
    "networkx>=3.4.2",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.14.5",
    "ty>=0.0.1a1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maths_lib"]

[tool.ruff.lint]
# Pin the rule set: Ruff 0.17 widened the defaults, which broke CI (unpinned ruff).
select = ["E4", "E7", "E9", "F"]
